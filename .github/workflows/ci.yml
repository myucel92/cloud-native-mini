name: AI DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
    contents: read
    pull-requests: write

jobs:
  build-test-scan-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Validate Flask app syntax
        run: |
          python -m py_compile app/app.py
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}    

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/myucel92/cloud-native-mini:${{ github.sha }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/myucel92/cloud-native-mini:${{ github.sha }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/myucel92/cloud-native-mini:${{ github.sha }}      

      - name: Run AI security review
        run: |
          python scripts/ai_review.py

      - name: Upload AI review report
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-review
          path: ai-review.txt
